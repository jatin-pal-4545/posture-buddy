
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Posture Buddy</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f5ef;
            padding: 20px;
        }

        .signup-box {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 8px 30px #00000012;
        }

        h1 {
            color: #172b4d;
            margin-bottom: 10px;
        }

        p {
            color: #777;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 16px;
            border: 1px solid #ddd;
            border-radius: 9px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #172b4d;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #263f65;
        }

        #message {
            margin-top: 18px;
            font-size: 14px;
            line-height: 1.5;
        }

        .login-link {
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
        }

        a {
            color: #456b91;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="signup-box">

        <h1>Posture Buddy</h1>
        <p>Create your account to start monitoring your posture.</p>

        <form id="signupForm">

            <input
                type="text"
                id="name"
                placeholder="Your name"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="Email address"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Create password (minimum 6 characters)"
                minlength="6"
                required
            >

            <button type="submit" id="signupBtn">
                Create Account
            </button>

        </form>

        <div id="message"></div>

        <div class="login-link">
            Already have an account?
            <a href="login.html">Login</a>
        </div>

    </div>

    <script type="module" src="signup-page.js"></script>

</body>
</html>
